<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #050505;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #ffffff;
    --text-muted: #a1a1aa;
    --text-dim: #71717a;
    --font-heading: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', monospace;
  }

  html, body { height: 100%; }

  body {
    background:
      radial-gradient(ellipse 60% 40% at 15% -10%, rgba(255, 255, 255, 0.045), transparent 60%),
      radial-gradient(ellipse 70% 50% at 50% 110%, rgba(255, 255, 255, 0.035), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    -webkit-font-smoothing: antialiased;
    line-height: 1.65;
    display: flex;
    flex-direction: column;
  }

  ::selection { background: rgba(255, 255, 255, 0.25); color: #fff; }

  header {
    padding: 24px clamp(20px, 5vw, 56px);
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: var(--font-heading);
    font-weight: 800;
    font-size: 1.35rem;
    letter-spacing: -0.03em;
    text-decoration: none;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }
  .logo span {
    background: linear-gradient(135deg, #ffffff, #8a8a8f);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .logo::after {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ffffff;
    margin-left: 4px;
    margin-top: 10px;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
  }

  main {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 64px 20px;
    overflow: hidden;
  }

  .ghost {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -58%);
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: clamp(9rem, 34vw, 22rem);
    line-height: 1;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.02);
    -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.14);
    pointer-events: none;
    user-select: none;
  }

  .label {
    position: relative;
    font-family: var(--font-heading);
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .label::before {
    content: '';
    width: 38px; height: 3px;
    background: #ffffff;
    box-shadow: 0 0 14px rgba(255, 255, 255, 0.6);
  }

  h1 {
    position: relative;
    font-family: var(--font-heading);
    font-size: clamp(2.4rem, 7vw, 4.5rem);
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1.05;
    background: linear-gradient(180deg, #ffffff 30%, #a8a8ad 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  main p {
    position: relative;
    margin-top: 20px;
    max-width: 520px;
    color: var(--text-muted);
    font-size: 1rem;
  }

  .actions {
    position: relative;
    margin-top: 40px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-primary, .btn-ghost {
    font-family: var(--font-heading);
    padding: 14px 32px;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, border-color 0.25s ease;
  }
  .btn-primary {
    color: #050505;
    background: #f5f5f7;
    box-shadow: 0 0 28px rgba(255, 255, 255, 0.18);
  }
  .btn-primary:hover { transform: translateY(-2px); background: #ffffff; box-shadow: 0 0 44px rgba(255, 255, 255, 0.35); }
  .btn-ghost {
    color: var(--text);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-strong);
  }
  .btn-ghost:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.45); }

  footer {
    border-top: 1px solid var(--border);
    padding: 28px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.82rem;
  }

  @media (max-width: 680px) {
    .actions { width: 100%; max-width: 340px; flex-direction: column; }
    .btn-primary, .btn-ghost { display: block; width: 100%; text-align: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn-primary, .btn-ghost { transition: none; }
  }
</style>
